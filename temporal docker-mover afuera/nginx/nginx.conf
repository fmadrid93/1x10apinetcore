worker_processes 1;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    upstream api {
        server api:80;
    }

    upstream angular {
        server angular:80;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
    proxy_pass http://angular/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

    }
}
