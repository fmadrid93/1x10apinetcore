version: '3.8'

services:
  api:
    build: ./ApiEncuestaNetCore
    networks:
      - backend
    depends_on:
      - sqlserver
      - minio

  angular:
    build: ./AngularEncuestaNetCore
    networks:
      - backend
      
  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - angular
    networks:
      - backend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: Mo7oJob08o!684
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - backend
    volumes:
      - sqlserverdata:/var/opt/mssql

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: fabricio
      MINIO_ROOT_PASSWORD: 31032017
    volumes:
      - miniodata:/data
    networks:
      - backend

networks:
  backend:

volumes:
  sqlserverdata:
  miniodata:
